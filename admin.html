<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КиноВместе — Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #080910;
      --surface:  #0f1117;
      --surface2: #161822;
      --border:   #1e2130;
      --border2:  #252a3a;
      --accent:   #e84393;
      --accent2:  #ffd166;
      --green:    #06d6a0;
      --blue:     #4f8ef7;
      --purple:   #8b5cf6;
      --text:     #e8eaf2;
      --muted:    #5c6080;
      --mono:     'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Фон ─────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 10% 0%, rgba(232,67,147,.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 90% 100%, rgba(79,142,247,.05) 0%, transparent 60%);
    }

    /* ─── Топбар ──────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px;
      padding: 0 32px; height: 56px;
      background: rgba(8,9,16,.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-logo {
      font-family: 'Unbounded', sans-serif; font-size: .8rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .topbar-badge {
      font-family: var(--mono); font-size: .65rem; padding: 3px 10px;
      border-radius: 99px; background: rgba(232,67,147,.1);
      border: 1px solid rgba(232,67,147,.2); color: var(--accent);
    }
    .topbar-spacer { flex: 1; }
    .topbar-time {
      font-family: var(--mono); font-size: .72rem; color: var(--muted);
    }
    .topbar-key {
      font-family: var(--mono); font-size: .65rem; color: var(--muted);
      padding: 3px 10px; border-radius: 6px;
      border: 1px solid var(--border2); background: var(--surface2);
    }

    /* ─── Лейаут ──────────────────────────────────────── */
    .main {
      position: relative; z-index: 1;
      max-width: 1400px; margin: 0 auto;
      padding: 32px 32px 64px;
      display: flex; flex-direction: column; gap: 28px;
    }

    /* ─── Заголовок ───────────────────────────────────── */
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .page-title {
      font-family: 'Unbounded', sans-serif; font-size: 1.5rem; font-weight: 700;
      line-height: 1.2;
    }
    .page-title span {
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .page-subtitle { color: var(--muted); font-size: .85rem; margin-top: 4px; }
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 10px;
      border: 1px solid var(--border2); background: var(--surface2);
      color: var(--muted); font-family: 'Nunito', sans-serif;
      font-size: .8rem; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── Метрики ─────────────────────────────────────── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 20px;
      position: relative; overflow: hidden;
      transition: border-color .2s, transform .2s;
    }
    .metric-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .metric-card::before {
      content: ''; position: absolute; inset: 0; opacity: .04;
      background: linear-gradient(135deg, var(--card-color, var(--accent)), transparent);
    }
    .metric-card.green  { --card-color: var(--green); }
    .metric-card.blue   { --card-color: var(--blue); }
    .metric-card.purple { --card-color: var(--purple); }
    .metric-card.yellow { --card-color: var(--accent2); }

    .metric-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; margin-bottom: 14px;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
    }
    .metric-label { font-size: .68rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
    .metric-value {
      font-family: 'Unbounded', sans-serif; font-size: 1.6rem; font-weight: 700;
      line-height: 1; color: var(--text);
    }
    .metric-sub { font-size: .72rem; color: var(--muted); margin-top: 6px; }
    .metric-sub b { color: var(--green); }

    /* ─── Активные комнаты ────────────────────────────── */
    .section-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Unbounded', sans-serif; font-size: .75rem; font-weight: 600;
      color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase;
    }
    .section-count {
      font-family: var(--mono); font-size: .65rem; padding: 2px 8px;
      border-radius: 99px; background: var(--surface2);
      border: 1px solid var(--border); color: var(--muted);
    }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* ─── Таблица комнат ──────────────────────────────── */
    .rooms-table {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .table-header {
      display: grid; grid-template-columns: 90px 1fr 120px 100px 100px 120px 100px;
      padding: 10px 20px;
      background: var(--surface2); border-bottom: 1px solid var(--border);
      font-size: .62rem; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px; font-family: var(--mono);
    }
    .room-row {
      display: grid; grid-template-columns: 90px 1fr 120px 100px 100px 120px 100px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      transition: background .15s; cursor: pointer; align-items: center;
    }
    .room-row:last-child { border-bottom: none; }
    .room-row:hover { background: var(--surface2); }

    .room-code {
      font-family: var(--mono); font-size: .78rem; font-weight: 700;
      color: var(--accent2); letter-spacing: 1px;
    }
    .room-title { font-size: .85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
    .room-title-sub { font-size: .68rem; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-members { font-size: .82rem; display: flex; align-items: center; gap: 4px; }
    .room-time { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
    .room-platform {
      font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 99px;
      display: inline-flex; width: fit-content;
    }
    .plat-rutube  { background: rgba(255,64,64,.12);  color: #ff4040; border: 1px solid rgba(255,64,64,.2); }
    .plat-youtube { background: rgba(255,0,0,.1);     color: #ff4444; border: 1px solid rgba(255,0,0,.2); }
    .plat-vk      { background: rgba(76,117,163,.15); color: #4c75a3; border: 1px solid rgba(76,117,163,.25); }

    .status-badge {
      font-size: .65rem; font-weight: 700; padding: 3px 9px; border-radius: 99px;
      display: inline-flex; align-items: center; gap: 4px; width: fit-content;
    }
    .status-active   { background: rgba(6,214,160,.1); color: var(--green); border: 1px solid rgba(6,214,160,.2); }
    .status-closed   { background: rgba(92,96,128,.1); color: var(--muted); border: 1px solid var(--border); }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .room-msgs { font-family: var(--mono); font-size: .75rem; color: var(--muted); }

    .empty-state {
      padding: 48px; text-align: center; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .empty-state .icon { font-size: 2rem; opacity: .4; }
    .empty-state p { font-size: .82rem; }

    /* ─── Модалка деталей ─────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 20px; width: 100%; max-width: 700px;
      max-height: 85vh; overflow-y: auto; overflow-x: hidden;
      animation: modalIn .2s ease;
    }
    @keyframes modalIn { from { transform: scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-header {
      display: flex; align-items: center; gap: 12px;
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .modal-code {
      font-family: 'Unbounded', sans-serif; font-size: .9rem; color: var(--accent2);
      letter-spacing: 2px;
    }
    .modal-title-text { font-size: .9rem; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: .9rem;
      flex-shrink: 0; transition: all .15s;
    }
    .modal-close:hover { color: var(--text); border-color: var(--muted); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

    .modal-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .modal-stat {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; text-align: center;
    }
    .modal-stat-val { font-family: 'Unbounded', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .modal-stat-lbl { font-size: .62rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

    .modal-section-title {
      font-size: .65rem; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px;
      font-family: var(--mono);
    }

    .member-list { display: flex; flex-direction: column; gap: 6px; }
    .member-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 10px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .member-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; color: #fff;
    }
    .member-name { flex: 1; font-size: .82rem; font-weight: 600; }
    .member-ip { font-family: var(--mono); font-size: .65rem; color: var(--muted); }
    .member-msgs { font-size: .7rem; color: var(--muted); }
    .member-crown { font-size: .8rem; }

    .chat-log { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
    .chat-msg {
      padding: 6px 10px; border-radius: 8px; font-size: .8rem;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; gap: 8px; align-items: baseline;
    }
    .chat-msg-time { font-family: var(--mono); font-size: .6rem; color: var(--muted); flex-shrink: 0; }
    .chat-msg-name { font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .chat-msg-text { color: var(--text); word-break: break-word; }

    .video-list { display: flex; flex-direction: column; gap: 6px; }
    .video-item {
      padding: 8px 12px; border-radius: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; font-size: .8rem;
    }
    .video-num { font-family: var(--mono); font-size: .65rem; color: var(--muted); flex-shrink: 0; width: 18px; }
    .video-info { flex: 1; min-width: 0; }
    .video-title-modal { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-dur { font-family: var(--mono); font-size: .65rem; color: var(--muted); flex-shrink: 0; }

    /* ─── График активности ───────────────────────────── */
    .chart-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px;
    }
    .chart-title { font-family: 'Unbounded', sans-serif; font-size: .68rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 16px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar {
      width: 100%; border-radius: 4px 4px 0 0;
      background: linear-gradient(to top, var(--accent), rgba(232,67,147,.4));
      transition: height .5s cubic-bezier(.4,0,.2,1);
      min-height: 2px; cursor: pointer; position: relative;
    }
    .bar:hover { opacity: .8; }
    .bar-label { font-family: var(--mono); font-size: .55rem; color: var(--muted); }

    /* ─── Лоадер ──────────────────────────────────────── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      padding: 48px; gap: 12px; color: var(--muted); font-size: .82rem;
    }
    .loader-spin {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Скролл ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ─── Адаптив ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .main { padding: 16px; gap: 20px; }
      .topbar { padding: 0 16px; }
      .table-header,
      .room-row { grid-template-columns: 80px 1fr 80px 80px; }
      .table-header > *:nth-child(n+5),
      .room-row > *:nth-child(n+5) { display: none; }
      .modal-stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .page-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- Топбар -->
<div class="topbar">
  <div class="topbar-logo">КиноВместе</div>
  <div class="topbar-badge">ADMIN</div>
  <div class="topbar-spacer"></div>
  <div class="topbar-time" id="clock">--:--:--</div>
  <div class="topbar-key" id="keyDisplay">key: ***</div>
</div>

<div class="main">

  <!-- Заголовок -->
  <div class="page-header">
    <div>
      <div class="page-title">Панель <span>управления</span></div>
      <div class="page-subtitle">Статистика и логи комнат</div>
    </div>
    <button class="refresh-btn" onclick="loadAll()">⟳ Обновить</button>
  </div>

  <!-- Метрики -->
  <div class="metrics-grid" id="metricsGrid">
    <div class="loader"><div class="loader-spin"></div> Загружаем...</div>
  </div>

  <!-- График -->
  <div class="chart-wrap">
    <div class="chart-title">КОМНАТЫ ЗА ПОСЛЕДНИЕ 7 ДНЕЙ</div>
    <div class="bar-chart" id="barChart">
      <div class="loader"><div class="loader-spin"></div></div>
    </div>
  </div>

  <!-- Таблица комнат -->
  <div>
    <div class="section-header">
      <div class="section-title">Все комнаты</div>
      <div class="section-count" id="roomsCount">—</div>
      <div class="section-line"></div>
    </div>

    <!-- Фильтры -->
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="filter-btn active" onclick="setFilter('all')" id="f-all">Все</button>
      <button class="filter-btn" onclick="setFilter('active')" id="f-active">🟢 Активные</button>
      <button class="filter-btn" onclick="setFilter('closed')" id="f-closed">⚫ Закрытые</button>
    </div>

    <div class="rooms-table">
      <div class="table-header">
        <div>КОД</div>
        <div>НАЗВАНИЕ</div>
        <div>ПЛАТФОРМА</div>
        <div>УЧАСТНИКИ</div>
        <div>СООБЩЕНИЯ</div>
        <div>СОЗДАНА</div>
        <div>СТАТУС</div>
      </div>
      <div id="roomsList">
        <div class="loader"><div class="loader-spin"></div> Загружаем...</div>
      </div>
    </div>
  </div>

</div>

<!-- Модалка деталей -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="loader"><div class="loader-spin"></div></div>
  </div>
</div>

<style>
  .filter-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    font-family: 'Nunito', sans-serif; font-size: .75rem; font-weight: 700;
    cursor: pointer; transition: all .15s;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,67,147,.08); }
  .filter-btn:hover:not(.active) { border-color: var(--border2); color: var(--text); }
</style>

<script>
  // ─── Ключ из URL ─────────────────────────────────────
  const params  = new URLSearchParams(location.search);
  const KEY     = params.get('key') || '';
  const API     = (path) => `${path}?key=${KEY}`;
  if (!KEY) {
      location.replace('/');
  }
  document.getElementById('keyDisplay').textContent = KEY ? `key: ${KEY.slice(0,4)}***` : 'no key';

  // ─── Часы ─────────────────────────────────────────────
  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('ru-RU');
  }
  tick();
  setInterval(tick, 1000);

  // ─── Данные ───────────────────────────────────────────
  let allRooms  = [];
  let curFilter = 'all';

  function esc(t) {
    return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('ru-RU', {
      day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'
    });
  }

  function fmtDur(ms) {
    if (!ms) return '—';
    const s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60);
    if (h > 0) return `${h}ч ${m%60}м`;
    if (m > 0) return `${m}м`;
    return `${s}с`;
  }

  // ─── Загрузка всего ───────────────────────────────────
  async function loadAll() {
    await Promise.all([loadMetrics(), loadRooms()]);
  }

  // ─── Метрики ──────────────────────────────────────────
  async function loadMetrics() {
    try {
      const r    = await fetch(API('/api/admin/metrics'));
      const data = await r.json();
      renderMetrics(data);
      renderChart(data.dailyRooms || []);
    } catch(e) {
      document.getElementById('metricsGrid').innerHTML =
        `<div style="color:var(--accent);font-size:.8rem;grid-column:1/-1">Ошибка: ${e.message}</div>`;
    }
  }

  function renderMetrics(d) {
    document.getElementById('metricsGrid').innerHTML = `
      <div class="metric-card green">
        <div class="metric-icon">🏠</div>
        <div class="metric-label">Всего комнат</div>
        <div class="metric-value">${d.totalRooms ?? '—'}</div>
        <div class="metric-sub">Сегодня: <b>+${d.todayRooms ?? 0}</b></div>
      </div>
      <div class="metric-card blue">
        <div class="metric-icon">👥</div>
        <div class="metric-label">Пик онлайна</div>
        <div class="metric-value">${d.peakOnline ?? '—'}</div>
        <div class="metric-sub">Одновременно в комнатах</div>
      </div>
      <div class="metric-card purple">
        <div class="metric-icon">💬</div>
        <div class="metric-label">Всего сообщений</div>
        <div class="metric-value">${d.totalMessages ?? '—'}</div>
        <div class="metric-sub">За всё время</div>
      </div>
      <div class="metric-card yellow">
        <div class="metric-icon">🎬</div>
        <div class="metric-label">Видео просмотрено</div>
        <div class="metric-value">${d.totalVideos ?? '—'}</div>
        <div class="metric-sub">За всё время</div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">⏱</div>
        <div class="metric-label">Среднее время</div>
        <div class="metric-value" style="font-size:1.1rem">${fmtDur(d.avgDurationMs)}</div>
        <div class="metric-sub">Длительность комнаты</div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">🔴</div>
        <div class="metric-label">Активных сейчас</div>
        <div class="metric-value" style="color:var(--green)">${d.activeRooms ?? '—'}</div>
        <div class="metric-sub">Открытых комнат</div>
      </div>
    `;
  }

  function renderChart(daily) {
    if (!daily.length) {
      document.getElementById('barChart').innerHTML = '<div style="color:var(--muted);font-size:.8rem">Нет данных</div>';
      return;
    }
    const max = Math.max(...daily.map(d => d.count), 1);
    document.getElementById('barChart').innerHTML = daily.map(d => `
      <div class="bar-wrap">
        <div class="bar" style="height:${Math.max(4,(d.count/max)*80)}px" title="${d.date}: ${d.count} комнат"></div>
        <div class="bar-label">${d.label}</div>
      </div>
    `).join('');
  }

  // ─── Комнаты ──────────────────────────────────────────
  async function loadRooms() {
    try {
      const r = await fetch(API('/api/admin/logs'));
      allRooms = await r.json();
      document.getElementById('roomsCount').textContent = allRooms.length;
      renderRooms();
    } catch(e) {
      document.getElementById('roomsList').innerHTML =
        `<div class="empty-state"><div class="icon">⚠️</div><p>Ошибка: ${e.message}</p></div>`;
    }
  }

  function setFilter(f) {
    curFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('f-' + f).classList.add('active');
    renderRooms();
  }

  function renderRooms() {
    let list = allRooms;
    if (curFilter === 'active') list = list.filter(r => r.isActive);
    if (curFilter === 'closed') list = list.filter(r => !r.isActive);

    if (!list.length) {
      document.getElementById('roomsList').innerHTML =
        `<div class="empty-state"><div class="icon">📭</div><p>Комнат нет</p></div>`;
      return;
    }

    document.getElementById('roomsList').innerHTML = list.map(r => `
      <div class="room-row" onclick="openRoom('${esc(r.folder)}')">
        <div class="room-code">${esc(r.code)}</div>
        <div>
          <div class="room-title">${esc(r.title || '—')}</div>
          <div class="room-title-sub">${fmtDate(r.createdAt)}</div>
        </div>
        <div><span class="room-platform plat-${r.stats?.platform || 'rutube'}">${esc(r.stats?.platform || '—')}</span></div>
        <div class="room-members">👥 ${r.stats?.maxMembers ?? 0}</div>
        <div class="room-msgs">${r.stats?.totalMessages ?? 0}</div>
        <div class="room-time">${fmtDur(r.stats?.totalDurationMs)}</div>
        <div>
          <span class="status-badge ${r.isActive ? 'status-active' : 'status-closed'}">
            <span class="status-dot"></span>
            ${r.isActive ? 'Активна' : 'Закрыта'}
          </span>
        </div>
      </div>
    `).join('');
  }

  // ─── Детали комнаты ───────────────────────────────────
  async function openRoom(folder) {
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('modal').innerHTML =
      '<div class="loader"><div class="loader-spin"></div> Загружаем...</div>';

    try {
      const r    = await fetch(API(`/api/admin/logs/${folder}`));
      const data = await r.json();
      renderModal(data);
    } catch(e) {
      document.getElementById('modal').innerHTML =
        `<div class="loader" style="color:var(--accent)">Ошибка: ${e.message}</div>`;
    }
  }

  function renderModal(d) {
    const members = Object.values(d.members || {});
    const creatorId = d.creator?.socketId;

    const membersHtml = members.map(m => {
      const isCreator = Object.keys(d.members).find(id => d.members[id] === m) === creatorId;
      return `
        <div class="member-item">
          <div class="member-avatar">${(m.name||'?')[0].toUpperCase()}</div>
          <div class="member-name">${esc(m.name)}</div>
          <div class="member-ip">${esc(m.ip)}</div>
          <div class="member-msgs">💬 ${m.messageCount}</div>
          ${isCreator ? '<div class="member-crown">👑</div>' : ''}
        </div>
      `;
    }).join('');

    const chatHtml = (d.chat||[]).slice(-30).map(msg => `
      <div class="chat-msg">
        <span class="chat-msg-time">${new Date(msg.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span>
        <span class="chat-msg-name">${esc(msg.name)}</span>
        <span class="chat-msg-text">${esc(msg.text)}</span>
      </div>
    `).join('');

    const videosHtml = (d.videos||[]).map((v,i) => `
      <div class="video-item">
        <div class="video-num">${i+1}</div>
        <div class="video-info">
          <div class="video-title-modal">${esc(v.title || v.videoId)}</div>
          <div style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">${esc(v.platform)} · ${esc(v.videoId)}</div>
        </div>
        <div class="video-dur">${fmtDur(v.durationMs)}</div>
      </div>
    `).join('');

    document.getElementById('modal').innerHTML = `
      <div class="modal-header">
        <div class="modal-code">${esc(d.code)}</div>
        <div class="modal-title-text">${esc(d.title || '—')}</div>
        <span class="status-badge ${d.isActive ? 'status-active' : 'status-closed'}" style="flex-shrink:0">
          <span class="status-dot"></span>${d.isActive ? 'Активна' : 'Закрыта'}
        </span>
        <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('show')">✕</button>
      </div>
      <div class="modal-body">

        <div class="modal-stats">
          <div class="modal-stat">
            <div class="modal-stat-val">${d.stats?.maxMembers ?? 0}</div>
            <div class="modal-stat-lbl">Макс участников</div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-val">${d.stats?.totalMessages ?? 0}</div>
            <div class="modal-stat-lbl">Сообщений</div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-val">${d.stats?.totalVideos ?? 0}</div>
            <div class="modal-stat-lbl">Видео</div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-val">${fmtDur(d.stats?.totalDurationMs)}</div>
            <div class="modal-stat-lbl">Длительность</div>
          </div>
        </div>

        <div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.75rem;color:var(--muted)">
            <div>📅 Создана: <b style="color:var(--text)">${fmtDate(d.createdAt)}</b></div>
            <div>🚪 Закрыта: <b style="color:var(--text)">${fmtDate(d.closedAt)}</b></div>
            <div>🌐 Тип: <b style="color:var(--text)">${d.type === 'open' ? 'Открытая' : 'Закрытая'}</b></div>
            <div>👑 Создатель: <b style="color:var(--text)">${esc(d.creator?.name)} (${esc(d.creator?.ip)})</b></div>
          </div>
        </div>

        ${members.length ? `
        <div>
          <div class="modal-section-title">Участники (${members.length})</div>
          <div class="member-list">${membersHtml}</div>
        </div>` : ''}

        ${d.videos?.length ? `
        <div>
          <div class="modal-section-title">История видео</div>
          <div class="video-list">${videosHtml}</div>
        </div>` : ''}

        ${d.chat?.length ? `
        <div>
          <div class="modal-section-title">Чат (последние ${Math.min(d.chat.length,30)} из ${d.chat.length})</div>
          <div class="chat-log">${chatHtml}</div>
        </div>` : '<div style="color:var(--muted);font-size:.8rem">Сообщений не было</div>'}

      </div>
    `;
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('show');
    }
  }

  // ─── Старт ────────────────────────────────────────────
  loadAll();
  setInterval(loadAll, 30000); // обновляем каждые 30 сек
  
</script>
</body>
</html>
